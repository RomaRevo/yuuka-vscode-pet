name: Check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run checks
        run: npm run check
      - name: Build VSIX
        run: python build_vsix.py
      - uses: actions/upload-artifact@v4
        with:
          name: yuuka-vscode-pet-vsix
          path: dist/*.vsix
